<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  :root{
    --navy:#16264A; --navy-dark:#0D1830; --orange:#F5821F; --orange-soft:#FFEEDD;
    --white:#FFFFFF; --ink:#16264A; --muted:#6B7688; --border:#E4E8F0;
    --shadow: 0 8px 20px rgba(22,38,74,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--white); color:var(--ink);
    font-family:"Kanit","Noto Sans Thai Looped","Sarabun","Tahoma",sans-serif;
  }
  .sheet{max-width:960px;margin:0 auto;padding:0 0 28px;}

  /* ---- Header ---- */
  header{
    background:linear-gradient(135deg,#16264A 0%,#213768 100%);
    padding:26px 48px 22px; position:relative; overflow:hidden;
    border-bottom:7px solid var(--orange);
  }
  .title-row{
    position:relative; z-index:1; margin:0 0 4px;
  }
  h1{
    margin:0; color:#fff; font-size:34px; font-weight:800;
    line-height:1.25;
  }
  .datesub{
    position:relative; z-index:1; font-size:14px; color:#B9C3DA; font-weight:500;
  }

  .body-wrap{padding:26px 48px 0;}

  /* ---- Cards ---- */
  .cat-block{margin-bottom:0;}
  .card{
    background:var(--white); border:2px solid var(--border); border-radius:18px;
    padding:26px 30px 24px; margin-bottom:22px; box-shadow:var(--shadow);
    position:relative;
  }
  .card-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin:0 0 16px;
  }
  .cat-tag{
    flex:0 0 auto;
    background:var(--orange-soft); color:var(--orange); font-weight:800; font-size:13.5px;
    padding:6px 16px; border-radius:14px; letter-spacing:.02em; border:1.5px solid var(--orange);
    white-space:nowrap;
  }
  .card h3{
    margin:0; font-size:26px; font-weight:800; line-height:1.35; color:var(--navy);
    flex:1 1 420px; min-width:280px;
  }
  .section-label{
    margin:0 0 10px; font-size:16px; font-weight:800; color:var(--orange);
    text-transform:uppercase; letter-spacing:.03em;
  }
  .card ul{margin:0 0 18px; padding-left:0; list-style:none; font-size:19px; line-height:1.8; color:#2B3652; font-weight:500;}
  .card li{margin-bottom:10px; padding-left:20px; position:relative;}
  .card li::before{
    content:"-"; position:absolute; left:0; top:0; color:var(--orange); font-weight:800;
  }
  .meta-lines{margin:14px 0 0; padding-top:14px; border-top:1.5px dashed var(--border);}
  .meta-line{font-size:18px; line-height:1.7; color:#2B3652; margin-bottom:4px;}
  .meta-line b{color:var(--navy); font-weight:800;}
  .ref{
    font-size:14px; color:var(--muted); margin-top:14px; word-break:break-all; font-weight:600;
  }
  .ref b{color:var(--navy);}

  .empty{
    background:var(--white); border:2px dashed var(--border); border-radius:18px;
    padding:20px 26px; font-size:17px; color:var(--muted); font-style:italic; font-weight:600;
    margin-bottom:22px;
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="title-row">
      <h1>{{HEADING}}</h1>
    </div>
    <div class="datesub">รวบรวมเฉพาะข่าวที่เกี่ยวข้องกับวันที่ระบุเท่านั้น</div>
  </header>

  <div class="body-wrap">
    {{CATEGORY_BLOCKS}}
  </div>
</div>
</body>
</html>
